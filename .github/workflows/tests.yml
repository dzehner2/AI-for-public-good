name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check that INDEX.md matches the idea cards
        if: matrix.python-version == '3.13'
        run: |
          python tools/build_index.py
          git diff --exit-code INDEX.md || (echo "INDEX.md is out of date. Run tools/build_index.py and commit the result." && exit 1)
